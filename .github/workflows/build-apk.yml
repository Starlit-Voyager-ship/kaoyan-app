name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 安装 Android SDK
      - name: 安装 Android SDK
        run: |
          SDK_DIR="${{ github.workspace }}/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          cd "$SDK_DIR/cmdline-tools"
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdtools.zip
          unzip -qo cmdtools.zip
          mv cmdline-tools latest 2>/dev/null || true
          rm -f cmdtools.zip
          echo "${SDK_DIR}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 安装 SDK 组件 + 同意许可
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: 生成 local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 关键修复：输出到文件（不用管道），保留真实退出码
      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean assembleDebug --no-daemon --stacktrace --info > build-log.txt 2>&1
          GRADLE_EXIT=$?
          echo "========================================"
          echo "GRADLE EXIT CODE: $GRADLE_EXIT"
          echo "========================================"
          echo "=== 构建日志最后150行 ==="
          tail -150 build-log.txt
          echo "========================================"
          exit $GRADLE_EXIT

      - name: 查找 APK + 目录结构
        run: |
          echo "=== 所有 .apk 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null && echo "(找到)" || echo "未找到任何 APK"
          echo ""
          echo "=== app/build/outputs ==="
          ls -laR android/app/build/outputs/ 2>/dev/null || echo "outputs 不存在"
          echo ""
          echo "=== app/build 目录(前40行) ==="
          find android/app/build -maxdepth 6 -type f 2>/dev/null | head -40 || echo "build 为空"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-study-helper-debug-apk
          path: |
            **/*.apk
            android/**/*.apk
          if-no-files-found: warn
        if: always()

      - name: 上传构建日志
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build-log.txt
        if: always()
        continue-on-error: true
