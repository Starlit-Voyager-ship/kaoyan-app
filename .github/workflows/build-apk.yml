name: Build APK

# 触发：推送代码到 main/master 时自动构建；也可在 Actions 页面手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装前端依赖
        run: npm ci

      - name: 同步 Capacitor Android（把 www 打包进原生工程）
        run: npx cap sync android

      - name: 配置 Java JDK 17（Android Gradle Plugin 8 需要）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台并同意许可协议
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: 编译 Debug APK（无需签名，可直接安装）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-study-helper-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
