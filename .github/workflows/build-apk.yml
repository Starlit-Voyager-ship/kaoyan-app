name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 全局环境变量 —— 所有步骤都能看到
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

    steps:
      - uses: actions/checkout@v4

      # Node.js 22+
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx cap sync android

      # JDK 17 — Gradle 8 / AGP 8 要求
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 安装 Android 命令行工具
      - name: 安装 Android SDK
        run: |
          SDK_DIR="${{ github.workspace }}/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          cd "$SDK_DIR/cmdline-tools"
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdtools.zip
          unzip -qo cmdtools.zip
          mv cmdline-tools latest 2>/dev/null || true
          rm -f cmdtools.zip

          echo "${SDK_DIR}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 安装 SDK 组件 + 同意许可
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # 调试：打印环境信息
      - name: 检查环境
        run: |
          echo "=== ANDROID_HOME = $ANDROID_HOME ==="
          echo "=== ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT ==="
          ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" && echo "sdkmanager OK" || echo "sdkmanager MISSING"
          sdkmanager --list_installed 2>/dev/null | head -5 || echo "cannot list"

      # 生成 local.properties（Gradle 需要它来定位 SDK）
      - name: 生成 local.properties
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: 查找 APK 文件
        run: |
          echo "=== 搜索所有 APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "未找到任何 APK"
          echo "=== android/app/build 目录结构 ==="
          find android/app/build -maxdepth 5 -type f 2>/dev/null | head -30 || echo "build 目录不存在"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-study-helper-debug-apk
          path: |
            **/*.apk
            android/**/*.apk
          if-no-files-found: warn
        if: always()
