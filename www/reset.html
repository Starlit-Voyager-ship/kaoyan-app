<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>清除缓存 / 重置</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; line-height: 1.7; color: #333; }
    h1 { color: #6366f1; }
    button { font-size: 1rem; padding: 12px 20px; border: none; border-radius: 8px; background: #6366f1; color: #fff; cursor: pointer; margin-top: 12px; }
    #log { background: #f4f4f8; border-radius: 8px; padding: 12px; margin-top: 16px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; min-height: 80px; }
    .ok { color: #16a34a; } .warn { color: #d97706; }
  </style>
</head>
<body>
  <h1>🧹 缓存重置工具</h1>
  <p>这个页面用于清除<b>旧 Service Worker 缓存</b>——它正是"改了代码却一直加载旧版、云端修复不生效"的元凶。</p>
  <button id="btn">一键清除并进入应用</button>
  <div id="log">点击上方按钮开始…</div>

  <script>
    const log = (m, cls) => {
      const el = document.getElementById('log');
      el.innerHTML += (cls ? `<span class="${cls}">` : '') + m + (cls ? '</span>' : '') + '\n';
    };

    document.getElementById('btn').addEventListener('click', async () => {
      log('开始清除…');
      // 1. 注销所有 Service Worker
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          if (regs.length === 0) log('  · 没有已注册的 Service Worker（无需处理）', 'ok');
          for (const r of regs) {
            await r.unregister();
            log('  · 已注销 Service Worker: ' + (r.scope || ''), 'ok');
          }
        } else {
          log('  · 当前环境不支持 Service Worker', 'warn');
        }
      } catch (e) { log('  · 注销 SW 出错（可忽略）：' + e.message, 'warn'); }

      // 2. 清空所有 Cache Storage
      try {
        if (window.caches) {
          const keys = await caches.keys();
          if (keys.length === 0) log('  · 没有缓存数据（无需处理）', 'ok');
          for (const k of keys) { await caches.delete(k); log('  · 已删除缓存: ' + k, 'ok'); }
        }
      } catch (e) { log('  · 清除缓存出错（可忽略）：' + e.message, 'warn'); }

      // 3. 顺手清掉可能残留的本地登录态（可选，避免一直自动进本地模式）——保留云端会话映射
      try {
        // 不清 cloud_user_ 映射，但清掉云端 API URL 探测缓存，确保重新探测到正确域名
        localStorage.removeItem('bmob_api_url');
        log('  · 已重置 Bmob API 域名探测缓存', 'ok');
      } catch (e) {}

      log('\n✅ 全部完成！3 秒后自动进入应用…', 'ok');
      setTimeout(() => { window.location.href = 'index.html?v=' + Date.now(); }, 3000);
    });
  </script>
</body>
</html>
